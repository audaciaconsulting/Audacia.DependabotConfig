name: Sync Dependabot Config

on:
  push:
    branches: [main]
    paths:
      - 'templates/dependabot.yaml'
      - 'templates/dependabot-checklist.yaml'
      - 'templates/CODEOWNERS'
      - '.github/sync.yaml'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: BetaHuhn/repo-file-sync-action@8b92be3375cf1d1b0cd579af488a9255572e4619 # v1
        id: sync
        with:
          GH_PAT: ${{ secrets.ORG_SYNC_PAT }}
          CONFIG_PATH: .github/sync.yaml
          TEAM_REVIEWERS: "dependabot-update-reviewers"
          COMMIT_PREFIX: "chore:"

      # The action derives PR titles from the last commit, which exceeds the
      # 100-char Conventional Commits header limit for longer file paths.
      - name: Set Conventional Commits PR titles
        if: steps.sync.outputs.pull_request_urls != ''
        env:
          GH_TOKEN: ${{ secrets.ORG_SYNC_PAT }}
          PR_URLS: ${{ steps.sync.outputs.pull_request_urls }}
          PR_TITLE: 'chore: sync Dependabot configuration'
        run: |
          set -euo pipefail
          echo "$PR_URLS" | jq -r '.[]' | while read -r url; do
            repo="${url#https://github.com/}"
            repo="${repo%%/pull/*}"
            number="${url##*/}"
            echo "Setting title on $repo#$number"
            gh api --method PATCH "repos/$repo/pulls/$number" -f title="$PR_TITLE"
          done
