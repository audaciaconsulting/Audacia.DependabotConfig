version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      main-application: 
        patterns: 
          - "*"
        update-types: 
          - "minor"
          - "patch"